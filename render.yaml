# ==============================================================================
# Render.com Blueprint Infrastructure Specification
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: epaper-renderer
    runtime: docker
    dockerfilePath: apps/renderer/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: RENDER_CONCURRENCY
        value: 4
      - key: RENDER_TIMEOUT_MS
        value: 35000
      - key: MAX_PAYLOAD_MB
        value: 15
      - key: RATE_LIMIT_MAX_PER_MINUTE
        value: 60
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
        value: /usr/bin/chromium
      # Configure to your Vercel or Cloudflare Pages frontend URL (e.g. https://your-app.vercel.app or https://*.vercel.app)
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: Whitelist external image domains if needed (comma-separated)
      - key: ALLOWED_ASSET_ORIGINS
        sync: false
      # Optional: Shared secret key for API authentication (leave empty to disable API key requirement)
      - key: RENDER_API_KEY
        sync: false

