<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>E-Paper Studio — Modern Newspaper Publishing</title>
    <meta
      name="description"
      content="Professional desktop publishing and editorial layout suite for Hindi, English, and bilingual newspapers. 8-column broadsheets, automated multi-page story continuation, and 300 DPI vector PDF export."
    />
    <meta
      name="keywords"
      content="newspaper layout, desktop publishing, DTP, epaper, hindi newspaper design, vernacular editorial, broadsheet layout, print-ready PDF, news studio"
    />
    <meta name="author" content="E-Paper Studio Engineering" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://epaperstudio.app/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://epaperstudio.app/" />
    <meta property="og:title" content="E-Paper Studio — Modern Newspaper Publishing" />
    <meta
      property="og:description"
      content="Desktop publishing designed for modern newsrooms. 8-column broadsheets, automated multi-page story continuation, and 300 DPI vector PDF export."
    />
    <meta property="og:image" content="https://epaperstudio.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="E-Paper Studio — Professional Editorial Workspace" />
    <meta property="og:site_name" content="E-Paper Studio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-Paper Studio — Modern Newspaper Publishing" />
    <meta
      name="twitter:description"
      content="Desktop publishing designed for modern newsrooms. 8-column broadsheets, automated multi-page story continuation, and 300 DPI vector PDF export."
    />
    <meta name="twitter:image" content="https://epaperstudio.app/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://epaperstudio.app/#software",
            "name": "E-Paper Studio",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Web, Windows, macOS, Linux",
            "description": "Professional desktop publishing suite for vernacular and English broadsheets, tabloids, and 300 DPI print-ready newspaper PDFs.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Multi-column newspaper layout balancing",
              "Multi-page story continuation and overflow handling",
              "Complex Devanagari (Hindi) and English typography support",
              "300 DPI CMYK-compatible vector PDF export",
              "Real-time preflight validation against press rules"
            ]
          },
          {
            "@type": "Organization",
            "@id": "https://epaperstudio.app/#organization",
            "name": "E-Paper Studio",
            "url": "https://epaperstudio.app/",
            "logo": "https://epaperstudio.app/logo.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://epaperstudio.app/#website",
            "url": "https://epaperstudio.app/",
            "name": "E-Paper Studio",
            "publisher": {
              "@id": "https://epaperstudio.app/#organization"
            }
          }
        ]
      }
    </script>

    <!-- Self-hosted Latin + Devanagari Typography -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link
      rel="preload"
      href="/fonts/poppins-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-devanagari-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-latin-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-devanagari-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      :root {
        --font-ui-sans: 'Poppins', 'Hind', sans-serif;
        --font-ui-hindi: 'Poppins', 'Hind', 'Mukta', sans-serif;
        --font-ui-display: 'Poppins', 'Playfair Display', 'Rozha One', Georgia, serif;
        --font-ui-hindi-display: 'Poppins', 'Hind', 'Noto Serif Devanagari', Georgia, serif;
        --font-ui-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        --lh-en-heading: 1.15;
        --lh-en-body: 1.55;
        --lh-hi-heading: 1.32;
        --lh-hi-body: 1.65;
        --lh-control: 1.25;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: var(--font-ui-sans);
        background-color: #faf8f5;
        color: #1c1917;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #991b1b;
        outline-offset: 2px;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
      .nav-desktop {
        display: flex !important;
        align-items: center;
        gap: 28px;
      }
      .mobile-toggle {
        display: none !important;
      }
      .mobile-menu-drawer {
        display: none;
      }
      @media (max-width: 768px) {
        .nav-desktop {
          display: none !important;
        }
        .mobile-toggle {
          display: inline-flex !important;
        }
        .mobile-menu-drawer {
          display: flex !important;
        }
      }
      .bento-card-4 {
        grid-column: span 4;
      }
      .bento-card-6 {
        grid-column: span 6;
      }
      @media (max-width: 900px) {
        .bento-card-4,
        .bento-card-6 {
          grid-column: span 12 !important;
        }
      }
      .arrow-connector {
        display: block;
      }
      @media (max-width: 768px) {
        .arrow-connector {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
